<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
__PORTAL_CSS__
</style>
<style>
__WORKER_CSS__
</style>
</head>
<body class="worker-app">
<main id="main">
  <div class="heading">
    <div>
      <h1><span data-text="recorder.title"></span> <span id="phase" class="badge"></span></h1>
      <p class="muted" data-text="recorder.subtitle"></p>
    </div>
    <div class="actions">
      <a id="open-portal" class="button primary" href="#" data-text="recorder.open_portal" hidden></a>
    </div>
  </div>

  <div class="stack">
    <div id="message" class="notice" role="status" hidden>
      <span id="message-text"></span>
      <button id="retry" class="button" type="button" data-text="recorder.retry" hidden></button>
    </div>

    <section id="pair-panel" class="panel" hidden>
      <div class="panel-header"><h2 data-text="recorder.pair_heading"></h2></div>
      <form id="pair-form" class="panel-body">
        <p class="hint" data-text="recorder.pair_intro"></p>
        <label class="field"><span data-text="recorder.invite_label"></span>
          <textarea id="invite" rows="3" required spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" data-placeholder="recorder.invite_placeholder"></textarea>
        </label>
        <label class="field"><span data-text="recorder.server_label"></span>
          <input id="server" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" data-placeholder="recorder.server_placeholder">
        </label>
        <div class="checklist"><label><input id="pair-firefox" type="checkbox"> <span data-text="recorder.firefox_label"></span></label></div>
        <div class="form-actions"><button id="pair-button" class="button primary" type="submit" data-text="recorder.pair_button"></button></div>
      </form>
    </section>

    <section id="download-panel" class="panel" hidden>
      <div class="panel-header"><h2 data-text="recorder.download_heading"></h2><span id="download-browser" class="muted"></span></div>
      <div class="panel-body">
        <div id="download-bar" class="progress"><i></i></div>
        <p><span id="download-text"></span> <span class="hint" data-text="recorder.download_hint"></span></p>
      </div>
    </section>

    <section id="status-panel" class="panel" hidden>
      <div class="panel-header"><h2 data-text="recorder.status_heading"></h2></div>
      <div class="panel-body stack">
        <dl class="kv-grid">
          <div class="wide"><dt data-text="recorder.server"></dt><dd id="server-value" class="mono"></dd></div>
          <div><dt data-text="recorder.device"></dt><dd id="device-value"></dd></div>
          <div><dt data-text="recorder.version"></dt><dd id="version-value" class="mono"></dd></div>
          <div class="wide"><dt data-text="recorder.token_storage"></dt><dd id="storage-value"></dd></div>
          <div class="wide"><dt data-text="recorder.data_dir"></dt><dd id="home-value" class="mono"></dd></div>
        </dl>
        <div id="version-warning" class="notice warn" hidden>
          <span data-text="recorder.version_mismatch"></span>
          <button id="download" class="text-btn" type="button" data-text="recorder.download_new"></button>
        </div>
        <div id="display-warning" class="notice warn" data-text="recorder.no_display" hidden></div>
        <div id="stopping-hint" class="notice" data-text="recorder.stopping_hint" hidden></div>
        <p id="active" class="current"></p>
      </div>
    </section>

    <section id="settings-panel" class="panel">
      <div class="panel-header"><h2 data-text="recorder.settings_heading"></h2></div>
      <div class="panel-body stack">
        <div class="checklist">
          <label id="firefox-setting"><input id="firefox" type="checkbox"> <span data-text="recorder.firefox_label"></span></label>
        </div>
        <div class="field-row">
          <label class="field"><span data-text="recorder.mirror_label"></span>
            <input id="mirror" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="https://mirror.example/playwright">
          </label>
          <button id="mirror-save" class="button" type="button" data-text="recorder.save"></button>
        </div>
        <div class="field-row">
          <label class="field"><span data-text="recorder.language_label"></span>
            <select id="language">
              <option value="zh-Hant">繁體中文</option>
              <option value="zh-Hans">简体中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>
        <div class="form-actions">
          <button id="open-logs" class="button" type="button" data-text="recorder.open_logs"></button>
          <button id="reset" class="button danger" type="button" data-text="recorder.reset_pairing" hidden></button>
          <button id="quit" class="button" type="button" data-text="recorder.quit"></button>
        </div>
      </div>
    </section>
  </div>
</main>

<dialog id="dialog" aria-labelledby="dialog-text">
  <div class="dialog-body"><p id="dialog-text"></p></div>
  <div class="dialog-foot">
    <button id="dialog-cancel" class="button" type="button" data-text="recorder.cancel"></button>
    <button id="dialog-ok" class="button primary" type="button" data-text="recorder.confirm"></button>
  </div>
</dialog>

<script id="strings" type="application/json">__STRINGS__</script>
<script>
__WORKER_JS__
</script>
</body>
</html>
