<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品明細 · 本機範例頁</title><style>body{font:14px/1.6 system-ui;color:#24334a;background:#f5f7fb;margin:0}header{background:white;border-bottom:1px solid #e9edf3;padding:12px 24px;color:#0b69c4;font-weight:700}main{max-width:640px;margin:24px auto;padding:0 16px}h1{font-size:21px}table{width:100%;border-collapse:collapse;background:white}td,th{border:1px solid #e9edf3;padding:6px 8px;text-align:left}input{padding:6px;border:1px solid #bec8d5;border-radius:6px}button{padding:6px 12px;background:#0b69c4;color:white;border:0;border-radius:6px;margin:12px 8px 0 0}#items-status{font-weight:700}</style><header>瀏覽器自動化 · 本機測試頁</header><main><h1>商品明細（SO-1001）</h1><table><thead><tr><th>行號</th><th>商品編號</th></tr></thead><tbody id="items"></tbody></table><p><button id="add-row" type="button">新增商品行</button><button id="save" type="button">儲存</button></p><p id="items-status" role="status"></p></main><script>
const rows=document.querySelector('#items');
document.querySelector('#add-row').onclick=()=>{const row=document.createElement('tr');row.innerHTML='<td>'+(rows.children.length+1)+'</td><td><input placeholder="請選擇" aria-label="商品編號"></td>';rows.append(row)};
document.querySelector('#save').onclick=()=>{const values=[...rows.querySelectorAll('input')].map(input=>input.value.trim()).filter(Boolean);document.querySelector('#items-status').textContent=values.length?'已儲存：'+values.join('、'):'請先新增商品行並填寫商品編號'};
</script></html>
