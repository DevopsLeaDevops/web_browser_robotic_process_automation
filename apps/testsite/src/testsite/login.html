<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入 · 本機範例頁</title><style>body{font:14px/1.6 system-ui;color:#24334a;background:#f5f7fb;margin:0}header{background:white;border-bottom:1px solid #e9edf3;padding:12px 24px;color:#0b69c4;font-weight:700}main{max-width:480px;margin:24px auto;padding:0 16px}.panel{padding:20px;background:white;border:1px solid #e9edf3;border-radius:9px;margin:12px 0}h1{font-size:21px}label{display:block;margin:12px 0}input{padding:8px;display:block;width:90%;border:1px solid #bec8d5;border-radius:6px}button{padding:8px 14px;background:#0b69c4;color:white;border:0;border-radius:6px}.notice{padding:10px;background:#eaf3ff}code{background:#eef2f7;padding:0 4px;border-radius:4px}#error{color:#b42318}</style><header>瀏覽器自動化 · 本機測試頁</header><main><h1>登入</h1><p class="notice">示範帳號（只存在這個本機測試網站）：一般使用者 <code>user</code> / <code>user-pass</code>；主管 <code>manager</code> / <code>manager-pass</code>。</p><form class="panel" id="login-form"><label>帳號<input id="username" name="username" autocomplete="username" required></label><label>密碼<input id="password" name="password" type="password" autocomplete="current-password" required></label><p><label style="display:inline"><input id="remember" type="checkbox" style="display:inline;width:auto"> 記住我</label></p><button>登入</button></form><p id="error" role="alert"></p><p><a href="/">回到範例紀錄</a></p></main><script>
document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();document.querySelector('#error').textContent='';const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const data=await response.json();if(!response.ok){document.querySelector('#error').textContent=data.error;return}const next=new URLSearchParams(location.search).get('next');location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/account'};
</script></html>
