<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>紀錄表單</title><style>body{font:14px/1.6 system-ui;color:#24334a;margin:0;padding:12px 16px}label{display:block;margin:8px 0}input{padding:6px;border:1px solid #bec8d5;border-radius:6px}button{padding:6px 12px;background:#0b69c4;color:white;border:0;border-radius:6px}iframe{display:block;width:100%;height:90px;border:1px dashed #bec8d5;border-radius:6px}#frame-status{font-weight:700}</style><form id="frame-form"><label>標題 <input id="frame-title" name="title" required></label><iframe id="note-frame" title="確認事項" src="/frames/note"></iframe><p><button>送出</button></p></form><p id="frame-status" role="status"></p><script>
document.querySelector('#frame-form').onsubmit=e=>{e.preventDefault();const note=document.querySelector('#note-frame').contentDocument.querySelector('#confirm');const status=document.querySelector('#frame-status');if(!note.checked){status.textContent='請先勾選「我已確認」';return}status.textContent='已送出：'+document.querySelector('#frame-title').value.trim()};
</script></html>
