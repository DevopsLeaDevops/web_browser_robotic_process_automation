<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的帳號 · 本機範例頁</title><style>body{font:14px/1.6 system-ui;color:#24334a;background:#f5f7fb;margin:0}header{background:white;border-bottom:1px solid #e9edf3;padding:12px 24px;color:#0b69c4;font-weight:700}main{max-width:760px;margin:24px auto;padding:0 16px}.panel{padding:20px;background:white;border:1px solid #e9edf3;border-radius:9px;margin:12px 0}h1{font-size:21px}h2{font-size:15px}dt{color:#64758b}dd{margin:0 0 8px}button{padding:8px 14px;background:#0b69c4;color:white;border:0;border-radius:6px}a{color:#0b69c4}</style><header>瀏覽器自動化 · 本機測試頁</header><main><h1>我的帳號</h1><section class="panel"><dl><dt>使用者</dt><dd data-testid="current-user" id="account-name">$name</dd><dt>帳號</dt><dd id="account-username">$username</dd><dt>角色</dt><dd id="account-role">$role</dd></dl><button id="logout">登出</button></section><section class="panel"><h2>我的待辦</h2><ul id="todos">$todos</ul><p>共 <span id="todo-count">$count</span> 項</p></section><p><a href="/">回到範例紀錄</a></p></main><script>

</script></html>
