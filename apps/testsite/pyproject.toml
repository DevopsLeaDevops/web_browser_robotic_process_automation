[project]
name = "rpa-testsite"
version = "0.5.0"
description = "模擬內部系統的本機測試網站：「測試網站自動化」的案例與測試都對它執行；rpa serve 會一起啟動"
requires-python = ">=3.12"
# 網站本身只用標準函式庫。testsite.browsers 是給測試用的輔助（需要 pytest 與 playwright，開發環境才有）。
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 模組名稱沿用 testsite（python -m testsite），不是由套件名稱推出的 rpa_testsite
module-name = "testsite"
