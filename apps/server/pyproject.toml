[project]
name = "rpa-server"
version = "0.1.0"
description = "管理 Portal：FastAPI 提供 API 與 Jinja 頁面；SQLite 存元資料，檔案目錄存版本與執行目錄"
requires-python = ">=3.12"
dependencies = [
  "rpa-core",
  "rpa-runner",
  "rpa-worker",
  # 版本下限在 uv.lock 產生後對齊實際解析到的版本
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "jinja2>=3.1.6",
  # 資料庫：SQLite 與 PostgreSQL 共用模型與遷移（ADR 0008）
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
]

[tool.uv.sources]
rpa-core = { workspace = true }
rpa-runner = { workspace = true }
rpa-worker = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
