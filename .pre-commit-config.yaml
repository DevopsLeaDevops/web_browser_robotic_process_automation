# 安裝：uv run pre-commit install
# ruff 與 pyright 走本機 uv 環境，版本跟 uv.lock 一致，不在這裡另外鎖版本。
exclude: ^docs/design-system/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # 繁中改了就重新產生簡中。檔案被改動時這次提交會中止，把新產生的檔案加入後再提交一次。
      - id: i18n-sync
        name: 產生簡體中文版
        entry: uv run python tools/i18n.py sync
        language: system
        files: ^(docs/|tools/|(packages|apps)/[^/]+/src/[^/]+/locales/)
        pass_filenames: false
      - id: docs-links
        name: 文檔連結檢查
        entry: uv run pytest -q tests/docs
        language: system
        files: ^docs/
        pass_filenames: false
