# 工程根目錄：uv workspace（虛擬根，不發佈）。
# 各套件在 packages/ 與 apps/ 下，各自有 pyproject.toml。
# 設計說明見 docs/index.html。

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv]
required-version = ">=0.11"
default-groups = ["dev"]

[tool.uv.sources]
rpa-core = { workspace = true }
rpa-runner = { workspace = true }
rpa-worker = { workspace = true }
rpa-server = { workspace = true }
rpa-cli = { workspace = true }

[dependency-groups]
dev = [
  # workspace 成員：裝進同一個開發環境
  "rpa-core",
  "rpa-runner",
  "rpa-worker",
  "rpa-server",
  "rpa-cli",
  # 工具鏈
  "ruff>=0.16.10",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  # FastAPI 的 TestClient
  "httpx>=0.28.1",
  "pre-commit>=4.6.2",
  # 由繁中產生簡中（tools/i18n.py）。鎖定版本：詞庫一更新，產生的簡中就會不同，
  # 升級時要一併執行 uv run python tools/i18n.py sync 並提交結果。見 ADR 0007。
  "opencc==1.4.2",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
# "." 讓 tools/ 也算本專案的模組（import 排序時歸在第一方）
src = ["packages/*/src", "apps/*/src", "."]
# 設計系統與 MVP 原型是整包匯入的外部交付物，不改寫
extend-exclude = ["docs/design-system", "docs/prototypes"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # import 排序
  "N",       # 命名
  "UP",      # 新語法
  "B",       # 常見錯誤
  "SIM",     # 簡化
  "C4",      # 推導式
  "RUF",     # ruff 專屬規則
  "PT",      # pytest 風格
  "ASYNC",   # asyncio 誤用（Playwright async 會大量用到）
  "PTH",     # 用 pathlib
  "T20",     # 禁止遺留 print
]
# 中文註解與字串中的全形標點是正常寫法
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["T20"]
# 命令列開發工具，輸出就是用 print
"tools/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["packages", "apps", "tests", "tools", "testsite"]
exclude = ["**/.venv", "docs"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
# 多個套件都有 tests/ 目錄，用 importlib 模式避免同名模組衝突
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
# 讓測試能匯入 tools/ 下的開發工具
pythonpath = ["."]
markers = [
  "browser: 需要真實瀏覽器（Playwright + Chromium）的測試",
]
