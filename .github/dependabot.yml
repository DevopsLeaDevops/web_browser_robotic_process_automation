version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python 依賴不用 Dependabot：它還不支援 uv workspace（解析失敗「your workspace requires rpa-cli」，
  # https://github.com/dependabot/dependabot-core/issues/12072 ）。改由 .github/workflows/uv-upgrade.yml
  # 每週執行 uv lock --upgrade 並開 PR。
