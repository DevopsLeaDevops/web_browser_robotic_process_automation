# 臨時 workflow（開 PR 前刪除）：開發環境連不到 PyPI，借 GitHub 的機器
# 1. 用 OpenCC 產生簡中並提交回分支
# 2. 跑 ruff、pyright、pytest，把結果寫成註記，方便在 API 讀取
name: tmp i18n bootstrap

on:
  push:
    branches: [m0/i18n]

permissions:
  contents: write

concurrency:
  group: tmp-i18n-bootstrap
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - name: 產生簡中
        run: uv run python tools/i18n.py sync
      - name: 提交產生的檔案
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(i18n): 以 OpenCC 產生簡體中文版"
            git push
            echo "::notice title=已提交簡中::$(git rev-parse HEAD)"
          else
            echo "::notice title=簡中沒有變動::$(git rev-parse HEAD)"
          fi
      - name: ruff
        if: always()
        run: uv run ruff check --output-format=github . && uv run ruff format --check .
      - name: pyright
        if: always()
        run: |
          uv run pyright --outputjson > "$RUNNER_TEMP/pyright.json" && exit 0
          python3 - "$RUNNER_TEMP/pyright.json" <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          lines = [
              f"{d['file'].split('/work/')[-1]}:{d['range']['start']['line'] + 1} {d['severity']}: {d['message']}"
              for d in data.get("generalDiagnostics", [])
          ]
          msg = "%0A".join(l.replace("%", "%25").replace("\n", " ") for l in lines[:80])
          print(f"::error title=pyright {len(lines)} 個問題::{msg}")
          EOF
          exit 1
      - name: pytest
        if: always()
        run: |
          set +e
          uv run pytest -q -rf -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          code=${PIPESTATUS[0]}
          msg="$(grep -E '^(FAILED|ERROR)|passed|failed|error' "$RUNNER_TEMP/pytest.log" | tail -n 60)"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=pytest 結果 (exit $code)::${msg}"
          exit $code
      - name: pytest 失敗詳情
        if: failure()
        run: |
          msg="$(grep -E -B2 -A12 '^(E |_{5,} )' "$RUNNER_TEMP/pytest.log" | head -n 150)"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=pytest 詳情::${msg}"
