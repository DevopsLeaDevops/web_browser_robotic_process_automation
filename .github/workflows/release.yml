# 發布（M10.1 PR 3）：推 v版本 標籤（例如 v0.2.0）時建立 GitHub 的草稿 Release。
#   1. 確認標籤是 v主.次.修、和每個套件與 uv.lock 的版本一致（tools/release_version.py），
#      而且標籤指向的提交已經在 main 上。
#   2. 呼叫桌面端建置（desktop.yml）：建置、自我測試、Windows 上安裝 → 端到端 → 升級 → 解除安裝。
#   3. 用它的產物建立**草稿** Release：RPA Worker 的安裝檔、免安裝 zip、SHA256SUMS.txt。
# 草稿只有維護者看得到；確認內容後在 GitHub 上按「發布」才公開（docs/design/desktop.html#release）。
# 已經有同一個標籤的草稿時（重新執行）換掉它的檔案；已經發布的不動，請改用新的版本。
name: 發布

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: 確認版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 標籤和套件的版本一致
        run: python3 tools/release_version.py check "$GITHUB_REF_NAME"
      - name: 標籤在 main 上
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=發布::$GITHUB_REF_NAME 指向的 ${GITHUB_SHA:0:7} 不在 main 上：先合併 PR 再在 main 打標籤"
            exit 1
          fi

  build:
    name: 建置與測試
    needs: check
    uses: ./.github/workflows/desktop.yml

  release:
    name: 草稿 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: worker-windows-latest
          path: release
      - name: 檔案與 SHA-256
        working-directory: release
        run: |
          ls -l
          # 安裝檔和 zip 各一個；名稱裡要有這次的版本
          version="${TAG#v}"
          for pattern in "RPA-Worker-Setup-$version-windows-x64.exe" "RPA-Worker-$version-windows-x64.zip"; do
            if [ ! -f "$pattern" ]; then
              echo "::error title=發布::產物裡沒有 $pattern"
              exit 1
            fi
          done
          sha256sum -- *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 建立或更新草稿
        working-directory: release
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<'EOF'
          ## RPA Worker（Windows x64）

          - **安裝檔** `RPA-Worker-Setup-…-windows-x64.exe`：只裝給目前的使用者，不需要管理員。
          - **免安裝** `RPA-Worker-…-windows-x64.zip`：解壓縮後執行 `rpa-worker.exe`。
          - 用管理 Portal「裝置」頁產生的邀請配對；沒有邀請連不上 Portal。
          - 還沒有程式碼簽章：Windows SmartScreen 可能提醒，選「其他資訊」→「仍要執行」。
            可以用 `SHA256SUMS.txt` 核對下載的檔案。

          Installer for the current user (no administrator rights needed) and a portable zip.
          Pair with an invitation from the admin Portal's Devices page. Not code-signed yet;
          verify downloads with `SHA256SUMS.txt`.
          EOF
          files=(*.exe *.zip SHA256SUMS.txt)
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error title=發布::$TAG 已經發布過了，不換它的檔案：請用新的版本"
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
            echo "::notice title=發布::已更新 $TAG 的草稿"
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag \
              --title "RPA Worker $TAG" --notes-file "$notes" --generate-notes
            echo "::notice title=發布::已建立 $TAG 的草稿，確認後在 GitHub 上按「發布」"
          fi
