name: CI

on:
  push:
    branches: [main]
  pull_request:
  # uv-upgrade.yml 推送依賴更新後手動觸發（GITHUB_TOKEN 的推送不會觸發 CI）
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 靜態檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: 安裝依賴
        # --locked：依 uv.lock 安裝；鎖檔與 pyproject.toml 不一致時失敗，提醒執行 uv lock
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        # 錯誤同時轉成 annotations，直接標在 PR 的檔案行上（tools/ci_annotations.py）
        run: |
          set +e
          uv run pyright --outputjson > pyright.json
          code=$?
          set -e
          uv run python tools/ci_annotations.py pyright pyright.json
          [ "$code" -eq 0 ] || uv run pyright
          exit "$code"

  # 測試範圍（handoff/tasks/20261019-ci-test-time.html）：
  # - Python 3.13（產品實際使用的版本，.python-version）每次都跑全部測試。
  # - Python 3.12 在 PR 上只跑不需瀏覽器的測試；推到 main 與手動觸發時跑全部。
  #   瀏覽器測試的行為不隨 Python 小版本改變，PR 上重複跑一份只多佔排隊時間。
  # - 每晚的 nightly.yml 在三個系統上跑全部測試，瀏覽器測試連跑三遍抓偶發問題。
  test:
    name: 測試（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      BROWSER_TESTS: ${{ (matrix.python == '3.13' || github.event_name != 'pull_request') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: 安裝依賴
        run: uv sync --locked
      - name: 安裝瀏覽器（Chromium、Firefox）
        if: env.BROWSER_TESTS == '1'
        run: uv run playwright install --with-deps chromium firefox
      - name: pytest
        env:
          # CI 中缺少瀏覽器時直接失敗，而不是略過；只跑不需瀏覽器的測試時，
          # 漏標 browser 的測試也會因此失敗，而不是悄悄略過
          RPA_REQUIRE_BROWSER: "1"
        # 4 個程序平行（ubuntu-latest 有 4 核）；同一個檔案的測試留在同一個程序，
        # 檔案層級的 fixture（例如測試網站）只啟動一次。--durations 列出最慢的 30 個。
        # 失敗的測試同時轉成 annotations（tools/ci_annotations.py）
        run: |
          args=(-n 4 --dist loadfile --durations=30 --junitxml=pytest-report.xml -o junit_family=xunit1)
          if [ "$BROWSER_TESTS" != 1 ]; then
            echo "::notice title=測試範圍::Python ${{ matrix.python }} 在 PR 上只跑不需瀏覽器的測試；瀏覽器測試在 Python 3.13 執行"
            args+=(-m "not browser")
          fi
          set +e
          uv run pytest "${args[@]}"
          code=$?
          set -e
          uv run python tools/ci_annotations.py junit pytest-report.xml
          exit "$code"
      - name: 保留測試報告（各測試的耗時）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.python }}
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 14
