name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 靜態檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: 安裝依賴
        # --locked：依 uv.lock 安裝；鎖檔與 pyproject.toml 不一致時失敗，提醒執行 uv lock
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        # 錯誤同時轉成 annotations，直接標在 PR 的檔案行上（tools/ci_annotations.py）
        run: |
          set +e
          uv run pyright --outputjson > pyright.json
          code=$?
          set -e
          uv run python tools/ci_annotations.py pyright pyright.json
          [ "$code" -eq 0 ] || uv run pyright
          exit "$code"

  test:
    name: 測試（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: 安裝依賴
        run: uv sync --locked
      - name: 安裝瀏覽器（Chromium、Firefox）
        run: uv run playwright install --with-deps chromium firefox
      - name: pytest
        env:
          # CI 中缺少瀏覽器時直接失敗，而不是略過
          RPA_REQUIRE_BROWSER: "1"
        # 失敗的測試同時轉成 annotations（tools/ci_annotations.py）
        run: |
          set +e
          uv run pytest --junitxml=pytest-report.xml -o junit_family=xunit1
          code=$?
          set -e
          uv run python tools/ci_annotations.py junit pytest-report.xml
          exit "$code"
