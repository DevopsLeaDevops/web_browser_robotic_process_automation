# 桌面端建置（M10，ADR 0014）：建 RPA 錄製端（macOS，Apple 晶片）與 RPA Worker（Windows x64），
# 再用打包後的 App 跑自我測試（rpa_desktop.selftest）：
#   App 用內附的 Playwright driver 把 Chromium 下載到全新的資料夾 → 啟動測試網站 →
#   無頭執行 BA-001（子程序走 --rpa-module）與它的 Python 腳本版（走 --rpa-script）。
# Worker 另外跑端到端（M10.1，tools/desktop_e2e.py）：從原始碼啟動管理 Portal、產生邀請，
#   打包版用邀請配對，以「遠端 worker」執行 BA-001 → BA-002。
# 產物（DMG、zip）掛在這次建置上 14 天；MVP 不簽章（docs/design/desktop.html#signing）。
name: 桌面端建置

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/worker/**"
      - "apps/testsite/**"
      - "apps/server/**"
      - "apps/cli/**"
      - "packages/**"
      - "scenarios/demo/**"
      - "tools/build_desktop.py"
      - "tools/desktop_e2e.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/worker/**"
      - "apps/testsite/**"
      - "apps/server/**"
      - "apps/cli/**"
      - "packages/**"
      - "scenarios/demo/**"
      - "tools/build_desktop.py"
      - "tools/desktop_e2e.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: recorder
            os: macos-14
            name: RPA 錄製端（macOS）
          - app: worker
            os: windows-latest
            name: RPA Worker（Windows）
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # 開發工具（uv run python …）印出中文時用 UTF-8；Windows 的主控台預設是 cp1252。
      # 打包後的 App 不讀這個變數，它在建置時就開了 UTF-8 模式（apps/desktop/packaging）。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: 安裝依賴（含打包工具）
        run: uv sync --locked --group desktop-build
      - name: 建置
        id: build
        run: uv run python tools/build_desktop.py ${{ matrix.app }}
      - name: 自我測試（打包後的 App）
        env:
          # 全新的資料夾：確定瀏覽器是打包後的 driver 下載的，不是開發環境留下的
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
          # 刻意關掉：App 要靠建置時開的 UTF-8 模式，不能依賴使用者電腦的環境變數
          PYTHONUTF8: "0"
        run: |
          "${{ steps.build.outputs.executable }}" --version
          set +e
          "${{ steps.build.outputs.executable }}" --self-test --report "${{ runner.temp }}/self-test.json" \
            > "${{ runner.temp }}/self-test.log" 2>&1
          code=$?
          set -e
          cat "${{ runner.temp }}/self-test.log"
          exit "$code"
      - name: 自我測試的結果寫成 annotations
        if: always()
        # 日誌在 PR 頁面就看得到：每一步的結果、失敗的原因與輸出的最後幾行
        run: uv run python tools/ci_annotations.py self-test "${{ runner.temp }}/self-test.json" "${{ runner.temp }}/self-test.log"
      - name: 端到端：打包版用邀請配對並執行範例場景
        id: e2e
        if: matrix.app == 'worker'
        env:
          # 沿用自我測試下載的 Chromium；打包版只在沒有設定時改用 Playwright 的預設位置
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          set +e
          uv run python tools/desktop_e2e.py "${{ steps.build.outputs.executable }}" \
            --report "${{ runner.temp }}/e2e.json" > "${{ runner.temp }}/e2e.log" 2>&1
          code=$?
          set -e
          cat "${{ runner.temp }}/e2e.log"
          exit "$code"
      - name: 端到端的結果寫成 annotations
        if: always() && matrix.app == 'worker' && steps.e2e.outcome != 'skipped'
        run: uv run python tools/ci_annotations.py self-test "${{ runner.temp }}/e2e.json" "${{ runner.temp }}/e2e.log"
      - name: 大小與結果
        if: always()
        run: |
          sizes="$( { du -sh dist/desktop/* "${{ runner.temp }}/pw-browsers" 2>/dev/null || true; } )"
          # 大小也寫成 annotation，在 PR 頁面就看得到
          echo "::notice title=大小（${{ matrix.app }}）::${sizes//$'\n'/%0A}"
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "$sizes"
            echo '```'
            for report in self-test e2e; do
              if [ -f "${{ runner.temp }}/$report.json" ]; then
                echo "<details><summary>$report.json</summary>"
                echo
                echo '```json'
                cat "${{ runner.temp }}/$report.json"
                echo '```'
                echo '</details>'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-${{ matrix.os }}
          path: ${{ steps.build.outputs.artifact }}
          retention-days: 14
          if-no-files-found: error
