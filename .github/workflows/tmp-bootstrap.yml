# 暫時的 workflow：雲端開發環境連不到 PyPI，改在 Actions 產生 uv.lock、簡中與 JSON Schema，
# 由 bot 提交回分支。開 PR 前刪除。
name: tmp-bootstrap

on:
  push:
    branches: [m1/dsl-v0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: uv lock
        run: uv lock
      - name: 安裝依賴
        run: uv sync --locked
      - name: 產生簡中
        run: uv run python tools/i18n.py sync
      - name: 產生 JSON Schema
        run: uv run rpa schema > schema/scenario.v1.json
      - name: 檢查
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -m "not browser"
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock docs apps packages schema
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "chore: 產生 uv.lock 與簡體中文版"
            git push
          fi
