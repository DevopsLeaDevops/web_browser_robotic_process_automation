# Linux 伺服器的分發包：建自帶 Python 的 tar.gz（x64、arm64），在同架構的 Rocky 8 容器裡實際安裝。
#   建置（tools/build_server.py）：uv 管理的 CPython ＋ 照 uv.lock 裝好的套件，限定 manylinux_2_28，
#   用包內的 Python 執行 rpa --version、載入伺服器的程式。
#   安裝（包內的 install.sh）：glibc 2.28、公司映像的 os-release（ID 空白）、一般帳號＋sudo，
#   沒有 git 時用真實 yum 補裝；沿用 setup-linux.sh（clone）留下的設定；冒煙（HTTP、埠隔離、
#   配對、重新啟動）；啟動器以設定檔的埠號啟動、第一次啟動匯入範例場景；重裝保留設定與資料；
#   新版本切換 current、舊版本保留；systemd unit 語法。容器沒有 systemd，服務啟停由公司主機驗收。
#   分層更新（ADR 0018）：用臨時金鑰簽一個「下一個提交」的更新檔，在 nohup 啟動的伺服器上執行
#   bin/rpa update，確認伺服器自己換成新版本；再裝一個故意壞掉的版本，確認自動退回。
#   臨時金鑰只在不是推版本標籤的建置使用；發布的分發包只信任 rpa_update.keys 的正式公鑰。
# 推 v版本 標籤時 release.yml 也呼叫這個流程（workflow_call），用它的產物建立草稿 Release。
name: 伺服器分發包

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/cli/**"
      - "apps/worker/**"
      - "apps/testsite/**"
      - "packages/**"
      # 只改這些套件的測試不影響分發包
      - "!apps/*/tests/**"
      - "!packages/*/tests/**"
      - "scenarios/demo/**"
      - "tools/build_server.py"
      - "tools/build_update.py"
      - "tools/linux_server_smoke.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/server-package.yml"
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/cli/**"
      - "apps/worker/**"
      - "apps/testsite/**"
      - "packages/**"
      - "!apps/*/tests/**"
      - "!packages/*/tests/**"
      - "scenarios/demo/**"
      - "tools/build_server.py"
      - "tools/build_update.py"
      - "tools/linux_server_smoke.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/server-package.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: server-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # changes 查詢上一次運行的結果；release.yml 呼叫時也要給

jobs:
  # 只改文件且上一次推送已通過時略過、沿用結果（tools/ci_changes.py）；推版本標籤時一律建置
  changes:
    name: 執行範圍
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_changes.py --workflow server-package.yml

  build:
    needs: changes
    if: needs.changes.outputs.mode != 'docs'
    name: 分發包（${{ matrix.label }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            os: ubuntu-latest
          - label: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: 測試升級用的臨時金鑰（推版本標籤時不產生）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          pub="$(PYTHONPATH=packages/rpa_update/src python3 -m rpa_update.build keygen --private "$RUNNER_TEMP/update-test.pem")"
          echo "RPA_UPDATE_EXTRA_KEYS=$pub" >> "$GITHUB_ENV"
      - name: 建置（系統的 python3 執行，只用標準函式庫）
        id: build
        run: python3 tools/build_server.py
      - name: 環境代號和最近一次發布比較（不同時，已經裝好的伺服器要用完整的分發包）
        # 只是提示（annotation）：發布時 release.yml 再比一次，寫進 Release 說明（2026-10-26）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-default-groups --package rpa-cli python -m tools.runtime_changes --latest --runtime-file "${{ steps.build.outputs.runtime_file }}"
      - name: 更新檔（模擬下一個提交；另一個故意壞掉）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: update
        env:
          RUNTIME: ${{ steps.build.outputs.target }}=${{ steps.build.outputs.runtime }}
        run: |
          set -euo pipefail
          run() { uv run --locked --no-default-groups --package rpa-cli python -m tools.build_update --runtime "$RUNTIME" --key "$RUNNER_TEMP/update-test.pem" "$@"; }
          run --commit 0000002
          mkdir -p dist/update-test
          mv dist/update/RPA-Update-*.zip dist/update-test/next.zip
          # 壞掉的版本：載入程式沒問題（rpa update 的檢查會過），啟動伺服器時才失敗，bin/rpa serve 要退回
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/server/src/rpa_server/app.py")
          text = path.read_text(encoding="utf-8")
          marker = "def create_app(settings: Settings | None = None) -> FastAPI:\n"
          assert marker in text
          path.write_text(text.replace(marker, marker + '    raise RuntimeError("broken on purpose (CI)")\n'), encoding="utf-8")
          PY
          run --commit 0000003
          git checkout -- apps/server/src/rpa_server/app.py
          mv dist/update/RPA-Update-*.zip dist/update-test/broken.zip
          ls -la dist/update-test
      - name: Rocky 8：安裝、沿用舊設定、冒煙、啟動器、重裝、升級
        env:
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: |
          docker run --rm -i -v "$GITHUB_WORKSPACE:/source:ro" -e ARTIFACT="/source/${ARTIFACT#"$GITHUB_WORKSPACE"/}" \
            rockylinux:8 bash -s <<'BASH'
          set -Eeuo pipefail
          # Rocky 8 的 glibc 2.28 是下限。git 不預先安裝：install.sh 要自己用 yum 補上。
          yum install -y sudo shadow-utils systemd tar gzip curl procps-ng bc >/dev/null
          if command -v git >/dev/null; then echo "映像已經有 git，無法驗證補裝"; exit 1; fi
          useradd --create-home --shell /bin/bash rpa-test
          echo 'rpa-test ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/rpa-test
          chmod 440 /etc/sudoers.d/rpa-test
          # 公司映像可能沒有 ID／名稱；VERSION_ID=3 不是 CentOS 3。
          printf 'NAME=""\nVERSION=""\nID=""\nID_LIKE="rhel fedora centos "\nVERSION_ID="3"\nPRETTY_NAME=""\n' > /etc/os-release
          cp "$ARTIFACT" /home/rpa-test/
          chown rpa-test:rpa-test /home/rpa-test/*.tar.gz
          sudo -H -u rpa-test bash -s <<'CHECK'
          set -Eeuo pipefail
          cd "$HOME"
          # 之前用 setup-linux.sh（clone）裝過：設定要沿用
          legacy="$HOME/code/web_browser_robotic_process_automation"
          mkdir -p "$legacy"
          printf 'export RPA_DATA_DIR=%q\nexport RPA_PORT=8090\nexport RPA_WORKER_PORT=8091\nexport RPA_WORKER_HOST=127.0.0.1\nexport RPA_TESTSITE_HOST=\n' \
            "$HOME/legacy-data" > "$legacy/.rpa-server.env"
          mkdir download
          tar -xzf RPA-Server-*.tar.gz -C download
          bundle="$(echo download/RPA-Server-*)"
          version="$(sed -n 's/^version=//p' "$bundle/BUILD_INFO")"
          commit="$(sed -n 's/^commit=//p' "$bundle/BUILD_INFO")"
          cat "$bundle/BUILD_INFO"
          du -sh "$bundle"

          bash "$bundle/install.sh"
          command -v git
          test "$(readlink rpa-server/current)" = "releases/$version-$commit"
          grep -q 'RPA_PORT=8090' rpa-server/rpa-server.env
          rpa-server/bin/rpa --version
          rpa-server/current/python/bin/python3 -c 'import platform; print(platform.python_version(), platform.libc_ver())'

          # 冒煙：暫存資料、隨機埠（HTTP、埠隔離、配對、重新啟動）
          rpa-server/current/python/bin/python3 /source/tools/linux_server_smoke.py \
            --rpa "$HOME/rpa-server/bin/rpa" --cwd "$HOME/rpa-server/current"

          # 啟動器：設定檔的埠號與資料目錄，第一次啟動匯入範例場景
          rpa-server/bin/rpa-server > server.log 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8090/api/openapi.json; then break; fi
            sleep 1
          done
          if ! curl -fsS 'http://127.0.0.1:8090/api/scenes?domain=testsite' | grep -qi 'ba-001'; then
            cat server.log
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true
          test -f legacy-data/rpa.db

          # 重裝：設定與資料不變
          echo '# retain this setting' >> rpa-server/rpa-server.env
          cp rpa-server/rpa-server.env env.before
          echo keep > legacy-data/keep.txt
          bash "$bundle/install.sh"
          cmp rpa-server/rpa-server.env env.before
          test "$(cat legacy-data/keep.txt)" = keep

          # 升級：模擬下一個提交的分發包，current 換過去、上一版保留，新版本照樣能啟動
          cp -a "$bundle" next
          sed -i 's/^commit=.*/commit=0000001/' next/BUILD_INFO
          bash next/install.sh
          test "$(readlink rpa-server/current)" = "releases/$version-0000001"
          test -d "rpa-server/releases/$version-$commit"
          rpa-server/current/python/bin/python3 /source/tools/linux_server_smoke.py \
            --rpa "$HOME/rpa-server/bin/rpa" --cwd "$HOME/rpa-server/current"
          cmp rpa-server/rpa-server.env env.before

          # 分層更新（ADR 0018）：只有推版本標籤以外的建置有測試用的更新檔
          if [ -f /source/dist/update-test/next.zip ]; then
            serving() { curl -fsS -o /dev/null http://127.0.0.1:8090/api/openapi.json; }
            # 執行中的伺服器是哪個版本（伺服器程序的 RPA_RELEASE_DIR）
            running() {
              local pid
              pid="$(pgrep -f -n 'python3 -m rpa_cli serve' || true)"
              [ -n "$pid" ] || return 0
              tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null | sed -n 's|^RPA_RELEASE_DIR=.*/||p'
            }
            nohup rpa-server/bin/rpa-server >> update.log 2>&1 < /dev/null &
            supervisor=$!
            for _ in $(seq 60); do serving && break; sleep 1; done
            serving
            test "$(running)" = "$version-0000001"

            # 更新：裝好、換 current，伺服器沒有進行中的工作，自己重新啟動成新版本
            rpa-server/bin/rpa update /source/dist/update-test/next.zip
            test "$(readlink rpa-server/current)" = "releases/$version-0000002"
            test -L "rpa-server/releases/$version-0000002/python"
            start=$(date +%s.%N)
            down=""
            for _ in $(seq 120); do
              if ! serving; then down=1; fi
              if [ "$(running)" = "$version-0000002" ] && serving && [ ! -e rpa-server/run/update.state ]; then break; fi
              sleep 0.25
            done
            test "$(running)" = "$version-0000002"
            test ! -e rpa-server/run/update.state
            test ! -e rpa-server/run/restart.request
            echo "重新啟動完成：$(echo "$(date +%s.%N) - $start" | bc) 秒（期間曾經連不上：${down:-否}）"
            curl -fsS 'http://127.0.0.1:8090/api/scenes?domain=testsite' | grep -qi 'ba-001'
            # 同一個更新檔再裝一次：不用更新
            rpa-server/bin/rpa update /source/dist/update-test/next.zip | grep -q '不用更新'

            # 壞掉的版本：開始服務之前就結束，bin/rpa serve 退回 0000002
            rpa-server/bin/rpa update --now /source/dist/update-test/broken.zip
            for _ in $(seq 120); do
              if [ -e rpa-server/run/update.failed ] && serving && [ "$(running)" = "$version-0000002" ]; then break; fi
              sleep 0.25
            done
            test "$(readlink rpa-server/current)" = "releases/$version-0000002"
            grep -q "target=$version-0000003" rpa-server/run/update.failed
            grep -q '退回' update.log
            serving

            # 清單被改過：簽章不符，拒絕，current 不變
            rpa-server/current/python/bin/python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("/source/dist/update-test/next.zip") as source, zipfile.ZipFile("tampered.zip", "w") as out:
              for info in source.infolist():
                  data = source.read(info)
                  if info.filename == "manifest.json":
                      data = data.replace(b"0000002", b"0000009")
                  out.writestr(info, data)
          PY
            if rpa-server/bin/rpa update tampered.zip; then echo "竄改過的更新檔不該裝得上"; exit 1; fi
            test "$(readlink rpa-server/current)" = "releases/$version-0000002"

            kill "$supervisor"
            wait "$supervisor" || true
            if pgrep -f 'python3 -m rpa_cli serve'; then echo "伺服器沒有跟著結束"; exit 1; fi
            ls rpa-server/releases rpa-server/runtimes
            tail -n 40 update.log
          fi
          CHECK
          # 容器沒有 systemd PID 1，只驗證 unit；真實服務啟停另由公司主機驗收。
          systemd-analyze verify /home/rpa-test/rpa-server/rpa-server.service
          BASH
      - name: 大小
        if: always() && steps.build.outcome == 'success'
        run: |
          size="$(du -h "${{ steps.build.outputs.artifact }}" | cut -f1)"
          echo "::notice title=伺服器分發包（${{ matrix.label }}）::$(basename "${{ steps.build.outputs.artifact }}")：$size"
          echo "### ${{ matrix.label }}：$size" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: server-linux-${{ matrix.label }}
          # runtime-<目標>.json：發布流程產生更新檔時要用（ADR 0018），不上傳到 Release
          path: |
            ${{ steps.build.outputs.artifact }}
            ${{ steps.build.outputs.runtime_file }}
          # 私有倉庫的產物計入 Actions 儲存額度（一次約 500 MB）：發布（標籤）只在同一次執行裡用，留 1 天；
          # PR 與 main 的試用包留 3 天。
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 3 }}
          if-no-files-found: error
