# 在乾淨的 macOS、Ubuntu、Windows 機器上實際跑一鍵安裝腳本，確認文檔裡的命令真的能用。
# 觸發時機：
# - 腳本、依賴或 Python 版本變動時（包括 Dependabot 的升級 PR）
# - 每週一次：抓出外部變化，例如 uv 安裝腳本改版、GitHub 更換 *-latest 的系統、瀏覽器下載方式改變
# - 在 Actions 頁面手動觸發
name: 一鍵安裝腳本

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/setup-scripts.yml"
      - "pyproject.toml"
      - "packages/*/pyproject.toml"
      - "apps/*/pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "tools/linux_server_smoke.py"
      - "tests/ci/test_linux_setup.py"
      - "apps/cli/src/rpa_cli/serve.py"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/setup-scripts.yml"
      - "pyproject.toml"
      - "packages/*/pyproject.toml"
      - "apps/*/pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "tools/linux_server_smoke.py"
      - "tests/ci/test_linux_setup.py"
      - "apps/cli/src/rpa_cli/serve.py"
  schedule:
    # America/Los_Angeles：週日 19:17 PDT（UTC−07:00）／18:17 PST（UTC−08:00）。避開整點。
    # 公開倉庫 60 天沒有任何活動時，GitHub 會自動停用排程。
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: setup-scripts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 失敗時把輸出最後幾行寫成註記，在 PR 的 Checks 頁面就能看到原因
  SETUP_LOG: setup.log
  # 從零開始的測試直接下載這次提交的腳本，跟文檔中的一行命令走同一條路
  SCRIPT_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/scripts
  # 從零 clone 也驗證同一提交，避免 PR 腳本搭配 main 的程式碼／測試。
  RPA_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  RPA_PORTAL_ARTIFACTS: ${{ github.workspace }}/test-results/portal

defaults:
  run:
    # 明確指定 bash 才會開 pipefail；否則「setup.sh | tee」會把腳本的失敗吞掉。
    # Windows 的步驟各自指定 shell: powershell。
    shell: bash

jobs:
  linux-server:
    name: Linux 伺服器（Rocky 8，${{ matrix.mode }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [in-repo, from-scratch]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: 真實 yum 安裝、重跑、啟動與配對
        env:
          SETUP_MODE: ${{ matrix.mode }}
        run: |
          docker run --rm -i -v "$GITHUB_WORKSPACE:/source:ro" \
            -e RPA_GIT_REF -e SETUP_MODE rockylinux:8 bash -s <<'BASH'
          set -Eeuo pipefail
          # Rocky 8 的 glibc 2.28 是腳本下限；以一般帳號驗證 sudo 路徑。
          yum install -y sudo shadow-utils systemd
          useradd --create-home --shell /bin/bash rpa-test
          echo 'rpa-test ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/rpa-test
          chmod 440 /etc/sudoers.d/rpa-test
          if [ "$SETUP_MODE" = in-repo ]; then
            cp -a /source /home/rpa-test/repo
            chown -R rpa-test:rpa-test /home/rpa-test/repo
            sudo -H -u rpa-test bash -c 'cd "$HOME/repo/scripts"; bash setup-linux.sh'
          else
            # 公司映像可能沒有 ID／名稱；VERSION_ID=3 不是 CentOS 3。
            printf 'NAME=""\nVERSION=""\nID=""\nID_LIKE="rhel fedora centos "\nVERSION_ID="3"\nPRETTY_NAME=""\n' > /etc/os-release
            cp /source/scripts/setup-linux.sh /home/rpa-test/setup-linux.sh
            sudo -H -u rpa-test env RPA_GIT_REF="$RPA_GIT_REF" bash -c \
              'cd "$HOME"; bash setup-linux.sh --dir "$HOME/repo"'
          fi
          sudo -H -u rpa-test bash -s <<'CHECK'
          set -Eeuo pipefail
          cd "$HOME/repo"
          getconf GNU_LIBC_VERSION
          .venv-server/bin/python --version
          # 重跑不能改鎖檔、使用者設定或資料。
          sha256sum uv.lock > /tmp/rpa-lock.sha
          echo '# retain this setting' >> .rpa-server.env
          cp .rpa-server.env /tmp/rpa-env.before
          source .rpa-server.env
          mkdir -p "$RPA_DATA_DIR"
          echo keep > "$RPA_DATA_DIR/keep.txt"
          bash scripts/setup-linux.sh
          cmp .rpa-server.env /tmp/rpa-env.before
          test "$(cat "$RPA_DATA_DIR/keep.txt")" = keep
          sha256sum -c /tmp/rpa-lock.sha
          .venv-server/bin/python -c 'import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "rpa_desktop"))'
          .venv-server/bin/python tools/linux_server_smoke.py
          CHECK
          # 容器沒有 systemd PID 1，只驗證 unit；真實服務啟停另由公司主機驗收。
          systemd-analyze verify /home/rpa-test/repo/.venv-server/rpa-server.service
          BASH

  in-repo:
    name: 專案內執行（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    env:
      # 腳本裡的 pytest 也寫一份 JUnit 報告；失敗時轉成註記，看得到是哪個測試、為什麼失敗
      PYTEST_ADDOPTS: --junitxml=pytest-report.xml -o junit_family=xunit1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: setup.sh
        if: runner.os != 'Windows'
        run: ./scripts/setup.sh 2>&1 | tee "$RUNNER_TEMP/$SETUP_LOG"
      # 第一次執行已在這台機器跑完全部測試；第二次只確認重跑腳本後環境仍然可用：
      # 不需瀏覽器的測試不跑，冒煙測試確認兩種瀏覽器能啟動、rpa run 能跑完範例場景。
      # 偶發問題改由 nightly.yml 每晚把瀏覽器測試連跑三遍來抓。
      - name: setup.sh 再執行一次（應該很快且成功；只跑冒煙測試）
        if: runner.os != 'Windows'
        env:
          PYTEST_ADDOPTS: --junitxml=pytest-report.xml -o junit_family=xunit1 -m smoke
        run: ./scripts/setup.sh 2>&1 | tee "$RUNNER_TEMP/$SETUP_LOG"

      # shell: powershell 是 Windows 內建的 PowerShell 5.1，跟多數使用者的環境一致
      - name: setup.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\setup.ps1
      # 第二次把輸出存檔，失敗時才能寫成註記（第一次維持使用者的執行方式）
      - name: setup.ps1 再執行一次（應該很快且成功；只跑冒煙測試）
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PYTEST_ADDOPTS: --junitxml=pytest-report.xml -o junit_family=xunit1 -m smoke
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\setup.ps1 > "%RUNNER_TEMP%\%SETUP_LOG%" 2>&1
          set code=%ERRORLEVEL%
          type "%RUNNER_TEMP%\%SETUP_LOG%"
          exit /b %code%

      - name: 失敗時把最後的輸出寫成註記
        if: failure() && runner.os != 'Windows'
        run: |
          log="$RUNNER_TEMP/$SETUP_LOG"
          [ -f "$log" ] || exit 0
          msg="$(tail -n 30 "$log")"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=setup.sh 最後 30 行輸出::${msg}"

      # 失敗的測試寫成註記（tools/ci_annotations.py）；報告來自腳本裡最後一次執行的 pytest
      - name: 失敗時把失敗的測試寫成註記
        if: failure() && runner.os != 'Windows'
        run: |
          [ -f pytest-report.xml ] || exit 0
          uv="$(command -v uv || echo "$HOME/.local/bin/uv")"
          "$uv" run python tools/ci_annotations.py junit pytest-report.xml
      # PowerShell 5.1 在 CI 裡會把原生命令的 stderr 當成錯誤，所以改回 Continue；Python 輸出用 UTF-8
      - name: 失敗時把失敗的測試寫成註記（Windows）
        if: failure() && runner.os == 'Windows'
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP $env:SETUP_LOG
          if (Test-Path $log) {
            $tail = (Get-Content $log -Tail 40 -Encoding UTF8 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Output "::error title=setup.ps1 output (last 40 lines)::$tail"
          }
          if (-not (Test-Path pytest-report.xml)) { exit 0 }
          $uv = (Get-Command uv -ErrorAction SilentlyContinue).Source
          if (-not $uv) { $uv = Join-Path $HOME '.local\bin\uv.exe' }
          if (Test-Path $uv) { & $uv run python tools/ci_annotations.py junit pytest-report.xml }
          exit 0

      - name: 保留 Portal 瀏覽器軌跡
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portal-in-repo-${{ matrix.os }}
          path: ${{ env.RPA_PORTAL_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 7

  # 從零開始驗證的是下載腳本、clone 指定提交、裝 uv、Python 與瀏覽器這條路；
  # 全部測試已在「專案內執行」的第一次跑過，這裡跑不需瀏覽器的測試加上冒煙測試。
  # 瀏覽器照常下載，冒煙測試確認剛下載的兩種瀏覽器能啟動、rpa run 能跑完範例場景。
  from-scratch:
    name: 從零開始（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_ADDOPTS: -m "not browser or smoke"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: curl | bash
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: curl -LsSf "$SCRIPT_BASE/setup.sh" | bash -s -- --dir "$RUNNER_TEMP/rpa" 2>&1 | tee "$RUNNER_TEMP/$SETUP_LOG"

      - name: 下載後以 -File 執行
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          irm "$env:SCRIPT_BASE/setup.ps1" -OutFile $env:TEMP\rpa-setup.ps1
          powershell -ExecutionPolicy Bypass -File $env:TEMP\rpa-setup.ps1 -Dir (Join-Path $env:RUNNER_TEMP 'rpa')

      - name: 保留 Portal 瀏覽器軌跡
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portal-from-scratch-${{ matrix.os }}
          path: ${{ env.RPA_PORTAL_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 7

      - name: 失敗時把最後的輸出寫成註記
        if: failure() && runner.os != 'Windows'
        run: |
          log="$RUNNER_TEMP/$SETUP_LOG"
          [ -f "$log" ] || exit 0
          msg="$(tail -n 30 "$log")"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=setup.sh 最後 30 行輸出::${msg}"
