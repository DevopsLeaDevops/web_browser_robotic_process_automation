# 每晚完整測試：在 macOS、Ubuntu、Windows 跑全部測試，瀏覽器測試再連跑兩遍（共三遍）。
#
# 為什麼要有這個流程（handoff/tasks/20261019-ci-test-time.html）：
# - PR 上的 CI 只在 Ubuntu 跑瀏覽器測試；一鍵安裝腳本也只在改動腳本或依賴時才觸發。
#   這裡讓 Windows、macOS 每天至少對 main 跑一次全部測試。
# - 過去一鍵安裝腳本在每台機器上把全部測試跑三遍，意外抓到過只偶爾出現的時序問題
#   （例如 run 38840392412 的契約草稿 inert、拖放位置）。PR 上改成只跑一遍之後，
#   重複執行搬到這裡，刻意連跑三遍；不靠自動重跑把失敗變成通過。
# - Python 3.12（最低支援版本）在 PR 上只跑不需瀏覽器的測試，這裡補跑全部。
# - PR 上的測試依生產角色分配（Linux 網站、Windows Worker、macOS 錄製端，docs/develop/ci.html），
#   其他組合（Firefox 的網站流程、Linux 上的 Worker 測試等）都在這裡跑：這是定時的「大全量」。
#
# - macOS 的程式碼層檢查（2026-10-27 起，docs/develop/ci.html#layered）：PR 上的錄製端（macOS）只在
#   錄製、調試、閘道與 macOS 專屬的程式改了時才建置，Worker（macOS）只在外殼或它的 macOS 部分改了
#   時。這裡每晚用 main 的程式在兩個 macOS App 上跑一次程式碼層路徑（desktop.yml，外殼來自快取），
#   一般的程式改動在 macOS 上的問題最晚隔天就看得到；發布一律完整建置。
#
# 手動觸發（Actions → 每晚完整測試 → Run workflow）可以選系統與重跑次數，隨時跑一次大全量。
# 排程失敗時自動開（或更新）一個 ci-schedule 標籤的 issue。
#
# 逐一執行（不加 -n），跟使用者電腦上的執行方式一致，也不額外增加機器負載造成的逾時。
name: 每晚完整測試

on:
  schedule:
    # 每天 20:17 UTC：America/Los_Angeles 13:17 PDT（UTC−07:00）／12:17 PST（UTC−08:00），新加坡 04:17。
    # 倉庫最空閒的時段（2026-10-12～19 的 19～22 UTC 沒有任何運行），不和 PR 搶 macOS 的
    # 並行名額（每個帳號最多 5 個）。之前的 07:17 UTC（新加坡 15:17）是最忙的時段之一。
    # 公開倉庫 60 天沒有任何活動時，GitHub 會自動停用排程。
    - cron: "17 20 * * *"
    # 每週六 22:47 UTC：三個桌面 App 完整建置一次（desktop.yml，build=full），抓 GitHub 映像的變化。
    # America/Los_Angeles 15:47 PDT（UTC−07:00）／14:47 PST（UTC−08:00），新加坡週日 06:47。
    # 排在當天的每晚完整測試（20:17，最長約 70 分）與一鍵安裝腳本（20:47）之後，依賴更新（週日 22:17）之前。
    - cron: "47 22 * * 6"
  # 修改本流程的 PR 先實際跑一次；排程流程要先進 main 才能手動觸發
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"
  workflow_dispatch:
    inputs:
      systems:
        description: "要跑的系統，逗號分隔：ubuntu,macos,windows（空白＝全部）"
        type: string
        default: ""
      extra:
        description: "第 1 遍全部測試之後，瀏覽器測試再跑幾遍（Ubuntu 的 Python 3.12 不重跑）"
        type: number
        default: 2

concurrency:
  # 每週的桌面完整建置和每晚完整測試分開：不互相取消
  group: nightly-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # plan 查詢上一次運行的結果

defaults:
  run:
    shell: bash

jobs:
  # 矩陣與執行範圍（tools/ci_changes.py --nightly）：手動觸發時依選項篩選；
  # 修改本流程的 PR 之後只改文件、上一次已通過時略過
  plan:
    name: 執行範圍
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci_changes.py --workflow nightly.yml --scope full --nightly \
            --systems "${{ inputs.systems }}" --extra "${{ inputs.extra }}"

  full:
    name: 完整測試（${{ matrix.os }}，Python ${{ matrix.python }}）
    needs: plan
    if: >-
      github.event.schedule != '47 22 * * 6' &&
      needs.plan.outputs.mode != 'docs' && needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # extra：第 1 遍全部測試之後，瀏覽器測試再跑幾遍
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # 缺少瀏覽器時直接失敗，而不是略過
      RPA_REQUIRE_BROWSER: "1"
      REPORTS: ${{ github.workspace }}/test-results
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      # 跟一鍵安裝腳本（setup.ps1）跑測試時一樣用 UTF-8；Windows 預設的 cp1252 會讓
      # 測試自己啟動、印中文的子程序失敗（2026-10-19 PR #45 的第一次執行）
      - name: Windows：測試時用 UTF-8（與 setup.ps1 相同）
        if: runner.os == 'Windows'
        run: |
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"
      # Windows 的動態連接埠預設只有 49152～65535（16384 個），連線關閉後還要等 TIME_WAIT（數分鐘）
      # 才放回去。三遍測試連跑約 50 分，本機網站、管理 Portal 與瀏覽器之間的短連線可能把它用完，
      # 連線就失敗：Chromium 回報 net::ERR_NO_BUFFER_SPACE（WSAENOBUFS，10055）。
      # 2026-10-27 run 40581792306（issue #99）第 3 遍的 test_capture_saves_only_a_verified_state：
      # 同一個網址幾秒前才打開過、前兩遍都通過。放大到 10000～65535；測試與產品的固定連接埠
      # （8080 起的管理 Portal、測試網站的預設連接埠）都在 10000 以下，不受影響。
      # 之後每一遍結束時記下連線狀態（見「瀏覽器測試再跑」），再遇到時分得出是連接埠還是殘留程序。
      - name: Windows：放大動態連接埠範圍
        if: runner.os == 'Windows'
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55536
          netsh int ipv6 set dynamicport tcp start=10000 num=55536
          netsh int ipv4 show dynamicport tcp
      - name: 安裝依賴
        run: uv sync --locked
      - name: 安裝瀏覽器（Chromium、Firefox）
        id: browsers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            uv run playwright install --with-deps chromium firefox
          else
            uv run playwright install chromium firefox
          fi
      - name: 全部測試（第 1 遍）
        run: |
          mkdir -p "$REPORTS"
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          set +e
          "${display[@]}" uv run pytest --durations=30 --junitxml="$REPORTS/pass-1.xml" -o junit_family=xunit1
          code=$?
          set -e
          # 工具印中文；Windows 主控台預設不是 UTF-8
          PYTHONIOENCODING=utf-8 uv run python tools/ci_annotations.py junit "$REPORTS/pass-1.xml"
          exit "$code"
      # 第 1 遍失敗也照跑：看得出是穩定失敗還是偶發
      - name: 瀏覽器測試再跑 ${{ matrix.extra }} 遍（抓偶發問題）
        if: ${{ !cancelled() && matrix.extra > 0 && steps.browsers.outcome == 'success' }}
        run: |
          failed=""
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          # Windows：每一遍結束時記下 TCP 連線的狀態與還在跑的瀏覽器、Node 程序（註記），
          # 偶發的 ERR_NO_BUFFER_SPACE 再出現時看得出是 TIME_WAIT 把連接埠用完，還是程序沒結束
          sockets() {
            if [ "$RUNNER_OS" != Windows ]; then return 0; fi
            local states browsers
            # 只是診斷：指令失敗也不影響這一步的結果（GitHub 的 bash 帶 -eo pipefail）
            states="$(netstat -an | awk '$1 == "TCP" {print $4}' | sort | uniq -c | awk '{printf "%s %s；", $2, $1}' || true)"
            browsers="$(MSYS_NO_PATHCONV=1 tasklist /FO CSV /NH | grep -ciE '^"(chrome|chrome-headless-shell|firefox|node)\.exe"' || true)"
            echo "::notice title=第 $1 遍之後的連線::TCP（依狀態）：${states:-無} 還在跑的 Chromium／Firefox／Node 程序：${browsers:-0}"
          }
          sockets 1
          for pass in $(seq 2 $(( ${{ matrix.extra }} + 1 ))); do
            echo "::group::瀏覽器測試第 $pass 遍"
            set +e
            "${display[@]}" uv run pytest -m browser --junitxml="$REPORTS/pass-$pass.xml" -o junit_family=xunit1
            code=$?
            set -e
            echo "::endgroup::"
            sockets "$pass"
            PYTHONIOENCODING=utf-8 uv run python tools/ci_annotations.py junit "$REPORTS/pass-$pass.xml"
            if [ "$code" -ne 0 ]; then
              failed="$failed $pass"
              echo "::error title=瀏覽器測試第 $pass 遍失敗::同一份程式碼在前面的執行通過、這一遍失敗，通常是偶發的時序問題；看上面的註記與 test-results-* 裡的報告"
            fi
          done
          [ -z "$failed" ]
      - name: 保留測試報告
        if: always()
        # 診斷用的產物：私有倉庫的儲存額度用完時上傳會失敗，不要因此把通過的測試標成失敗
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ env.REPORTS }}
          if-no-files-found: ignore
          retention-days: 14

  # macOS 的程式碼層檢查：桌面端建置（desktop.yml）在兩個 macOS App 上走程式碼層路徑
  # （外殼在快取裡；不在時完整建置並存進快取）。手動觸發時只在選了 macOS（或全部）時跑。
  desktop-layer:
    name: macOS 桌面 App（程式碼層）
    needs: plan
    if: >-
      github.event.schedule != '47 22 * * 6' && needs.plan.outputs.mode != 'docs' &&
      (!inputs.systems || contains(inputs.systems, 'macos'))
    uses: ./.github/workflows/desktop.yml
    with:
      targets: recorder-macos-arm64,worker-macos-arm64
      build: auto
    # 快取的外殼信任 RPA_UPDATE_CI_KEY
    secrets: inherit
    permissions:
      contents: read
      actions: read

  # 每週六：三個桌面 App 完整建置（不用快取、不沿用），成功時更新外殼快取
  desktop-weekly:
    name: 桌面 App 每週完整建置
    if: github.event.schedule == '47 22 * * 6'
    uses: ./.github/workflows/desktop.yml
    with:
      build: full
    secrets: inherit
    permissions:
      contents: read
      actions: read

  # 排程的完整測試失敗時開（或更新）一個 issue，不必去翻 Actions 頁面才知道
  report-failure:
    name: 失敗時開 issue
    needs: [full, desktop-layer, desktop-weekly]
    # 測試失敗（failure）之外，一直排不到機器的 job 被標成 cancelled（「The job was not acquired
    # by Runner」，2026-10-28 run 40767854003 的 macOS 完整測試）：failure() 不成立，之前整個運行
    # 是紅的卻沒有開 issue，當天的 macOS 等於沒測。整個運行被取消（例如新的運行取代舊的）時
    # cancelled() 成立，不開。
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: ${{ github.workflow }}（排程）失敗
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          gh label create ci-schedule --color B60205 --description "排程的完整測試失敗" --force > /dev/null
          when="$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M')"
          zone="$(TZ=America/Los_Angeles date '+%Z，UTC%:z' | sed 's/-/−/')"
          body="排程執行失敗：${RUN_URL}（${when} America/Los_Angeles（${zone}））。失敗的測試與原因在該次運行的 annotations。"
          case " $RESULTS " in
            *" cancelled "*)
              body="$body 有 job 被取消：通常是一直排不到機器（annotations 寫「The job was not acquired by Runner」），那個系統這次沒有測，不是測試失敗；可在運行頁按 Re-run failed jobs 補跑。"
              ;;
          esac
          number="$(gh issue list --label ci-schedule --state open --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label ci-schedule --body "$body"
          fi
