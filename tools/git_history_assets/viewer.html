<!doctype html>
<html lang="@@LANG@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Git History</title>
<style>@@CSS@@</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-mark" aria-hidden="true">⌘</span><div><h1 id="repo-name"></h1><p id="summary"></p></div></div>
  <label class="language"><span data-i18n="language"></span><select id="language"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option></select></label>
</header>
<main>
  <p id="snapshot-note"></p>
  <p id="warning" class="warning" hidden></p>
  <div class="controls">
    <label><span data-i18n="scope"></span><select id="scope"></select></label>
    <label class="search"><span data-i18n="search"></span><input id="search" type="search" autocomplete="off" spellcheck="false"></label>
    <div class="search-nav"><span id="match-count" aria-live="polite"></span><button id="previous" type="button" data-i18n="previous"></button><button id="next" type="button" data-i18n="next"></button></div>
  </div>
  <div class="workspace">
    <section class="history" aria-labelledby="history-title">
      <div class="section-heading"><h2 id="history-title" data-i18n="history"></h2><span id="visible-count"></span></div>
      <div id="scroller" role="region" aria-label="Git history">
        <div id="spacer"><canvas id="graph" aria-hidden="true"></canvas><div id="rows"></div></div>
      </div>
      <p class="legend" data-i18n="legend"></p>
    </section>
    <aside id="details" aria-live="polite"></aside>
  </div>
  <footer><p data-i18n="coverage"></p><p data-i18n="refresh"></p><code id="refresh-command"></code></footer>
</main>
<script id="git-history-data" type="application/json">@@DATA@@</script>
<script>@@JS@@</script>
</body>
</html>
