<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本機範例頁</title><style>body{font:14px/1.6 system-ui;color:#24334a;background:#f5f7fb;margin:0}header{background:white;border-bottom:1px solid #e9edf3;padding:12px 24px;color:#0b69c4;font-weight:700}main{max-width:760px;margin:24px auto;padding:0 16px}.panel{padding:20px;background:white;border:1px solid #e9edf3;border-radius:9px;margin:12px 0}h1{font-size:21px}h2{font-size:15px}label{display:block;margin:12px 0}input{padding:8px;display:block;width:90%;border:1px solid #bec8d5;border-radius:6px}button{padding:8px 14px;background:#0b69c4;color:white;border:0;border-radius:6px}dt{color:#64758b}dd{margin:0 0 8px}.notice{padding:10px;background:#eaf3ff}a{color:#0b69c4}[hidden]{display:none!important}</style><header>瀏覽器自動化 · 本機測試頁</header><main><h1>範例紀錄</h1><p class="notice">這是獨立的本機 Demo；只建立測試資料，不連線外部系統。</p><nav><a href="/">建立紀錄</a> · <a href="/?view=query">查詢紀錄</a></nav><form class="panel" id="create-form"><h2>建立範例紀錄</h2><label>標題<input id="title" name="title" required maxlength="60"></label><label>數量<input id="quantity" name="quantity" type="number" min="1" max="30" required></label><button>建立紀錄</button></form><form class="panel" id="query-form" hidden><h2>查詢範例紀錄</h2><label>紀錄編號<input id="lookup-id" required></label><button>查詢</button></form><p id="error" role="alert"></p><section class="panel" id="receipt" hidden><h2>紀錄詳情</h2><dl><dt>紀錄編號</dt><dd id="record-id"></dd><dt>標題</dt><dd id="record-title"></dd><dt>數量</dt><dd id="record-quantity"></dd><dt>狀態</dt><dd id="record-status"></dd></dl></section></main><script>
const query=new URLSearchParams(location.search).get('view')==='query';document.querySelector('#create-form').hidden=query;document.querySelector('#query-form').hidden=!query;
async function request(url,options){document.querySelector('#error').textContent='';document.querySelector('#receipt').hidden=true;try{const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.error);for(const [id,value]of Object.entries({'record-id':data.recordId,'record-title':data.title,'record-quantity':data.quantity,'record-status':data.status}))document.getElementById(id).textContent=value;document.querySelector('#receipt').hidden=false;}catch(e){document.querySelector('#error').textContent=e.message}}
document.querySelector('#create-form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;await request('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#title').value,quantity:Number(document.querySelector('#quantity').value)})});button.disabled=false};document.querySelector('#query-form').onsubmit=e=>{e.preventDefault();request('/api/records/'+encodeURIComponent(document.querySelector('#lookup-id').value))};
</script></html>
